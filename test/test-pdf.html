<!doctype html>
<html lang="en">

	<head>
		<meta charset="utf-8">

		<title>reveal.js - Test PDF exports</title>
	</head>

	<body style="overflow: auto;">

		<div id="qunit"></div>
  		<div id="qunit-fixture"></div>

		<div class="reveal" style="display: none;">

			<div class="slides">

				<section>
					<h1>1</h1>
					<img data-src="">
				</section>

				<section>
					<section>
						<h1>2.1</h1>
					</section>
					<section>
						<h1>2.2</h1>
					</section>
					<section>
						<h1>2.3</h1>
					</section>
				</section>

				<section id="fragment-slides">
					<section>
						<h1>3.1</h1>
						<ul>
							<li class="fragment">4.1</li>
							<li class="fragment">4.2</li>
							<li class="fragment">4.3</li>
						</ul>
					</section>

					<section>
						<h1>3.2</h1>
						<ul>
							<li class="fragment" data-fragment-index="0">4.1</li>
							<li class="fragment" data-fragment-index="0">4.2</li>
						</ul>
					</section>

					<section>
						<h1>3.3</h1>
						<ul>
							<li class="fragment" data-fragment-index="1">3.3.1</li>
							<li class="fragment" data-fragment-index="4">3.3.2</li>
							<li class="fragment" data-fragment-index="4">3.3.3</li>
						</ul>
					</section>
				</section>

				<section>
					<h1>4</h1>
				</section>

			</div>

		</div>

		<script type="module">
			import 'reveal.css';
			import 'qunit/qunit/qunit.css';
			import QUnit from 'qunit';
			import Reveal from 'reveal.js';

			QUnit.config.testTimeout = 30000;
			QUnit.config.autostart = false;

			const pdfReady = new Promise( resolve => Reveal.on( 'pdf-ready', resolve ) );

			Promise.all( [
				Reveal.initialize({
					view: 'print',
					slideNumber: 'c/t',
					showSlideNumber: 'print',
					pdfSeparateFragments: false
				}),
				pdfReady
			] ).then( function() {

				QUnit.start();

				// Only one test for now, we're mainly ensuring that there
				// are no execution errors when running PDF mode

				QUnit.test( 'Reveal.isReady', function( assert ) {
					assert.strictEqual( Reveal.isReady(), true, 'returns true' );
				});

				QUnit.test( 'configured slide number format', function( assert ) {
					const slideNumbers = Array.from( document.querySelectorAll( '.slide-number-pdf' ) );
					assert.strictEqual( slideNumbers.length, 8, 'creates a number for each slide' );
					assert.strictEqual( slideNumbers[4].textContent.replace( /\s/g, '' ), '5/8', 'uses the configured c/t format' );
				});

			} );

		</script>

	</body>
</html>
