<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>Slide Deck Directional</title>

		<link rel="stylesheet" href="../dist/reset.css" />
		<link rel="stylesheet" href="../dist/reveal.css" />
		<link rel="stylesheet" href="../dist/theme/black.css" />

		<style>
			:root {
				--r-link-color: #ffffff;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				background: #000;
			}

			.reveal {
				width: 100%;
				height: 100%;
			}

			.reveal .slides {
				width: 100%;
				height: auto !important;
				aspect-ratio: 16 / 9;
			}

			.reveal .backgrounds {
				position: absolute;
				width: 100%;
				top: 0;
				left: 0;
				perspective: 600px;
				aspect-ratio: 16 / 9;
			}

			.reveal .slides section {
				display: flex;
				align-items: center;
				justify-content: center;
				background: #000;
			}

			.reveal .slides > section.stack {
				padding-top: 0;
				padding-bottom: 0;
				pointer-events: none;
				height: auto;
			}

			.reveal.overview .slides > section.stack {
				padding: 0;
				top: 0 !important;
				background: none;
				outline: none;
				overflow: visible;
				aspect-ratio: 16 / 9;
			}

			.reveal img,
			.reveal video,
			.reveal iframe {
				max-width: none;
				max-height: none;
				margin: 0;
			}

			.slide-image {
				display: block;
				width: 100%;
				height: 100%;
				border: 0;
				box-shadow: none;
				object-fit: contain;
				background: #000;
			}

			@keyframes bump-left {
				0%,
				100% {
					transform: none;
				}
				50% {
					transform: translateX(-4px);
				}
			}

			@keyframes bump-right {
				0%,
				100% {
					transform: none;
				}
				50% {
					transform: translateX(4px);
				}
			}

			@keyframes bump-up {
				0%,
				100% {
					transform: none;
				}
				50% {
					transform: translateY(-4px);
				}
			}

			@keyframes bump-down {
				0%,
				100% {
					transform: none;
				}
				50% {
					transform: translateY(4px);
				}
			}

			.reveal .controls .navigate-left.bump {
				animation: bump-left 180ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
			}

			.reveal .controls .navigate-right.bump {
				animation: bump-right 180ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
			}

			.reveal .controls .navigate-up.bump {
				animation: bump-up 180ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
			}

			.reveal .controls .navigate-down.bump {
				animation: bump-down 180ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
			}

			.reveal .controls .navigate-left,
			.reveal .controls .navigate-right,
			.reveal .controls .navigate-up,
			.reveal .controls .navigate-down {
				transform: none;
			}

			.helper-tip {
				position: fixed;
				left: 50%;
				bottom: 28px;
				z-index: 30;
				transform: translateX(-50%);
				padding: 10px 16px;
				border-radius: 999px;
				background: rgba(0, 0, 0, 0.72);
				color: rgba(255, 255, 255, 0.8);
				font-family: Arial, Helvetica, sans-serif;
				font-size: 18px;
				font-stretch: normal;
				line-height: 1;
				letter-spacing: 0.01em;
				text-align: center;
				white-space: nowrap;
				pointer-events: none;
				user-select: none;
				opacity: 0.95;
			}

			.helper-tip[hidden] {
				display: none !important;
			}

			.helper-tip__icon {
				display: inline-block;
				width: 1.15em;
				height: 1.15em;
				vertical-align: -0.18em;
				margin: 0 0.22em 0 0;
			}

			.helper-tip__icon svg {
				display: block;
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div class="reveal">
			<div class="slides" id="slides"></div>
		</div>
		<div class="helper-tip" id="helper-tip" aria-live="polite" hidden></div>

		<script src="../dist/reveal.js"></script>
		<script src="../dist/plugin/notes.js"></script>
		<script src="../dist/plugin/markdown.js"></script>
		<script src="../dist/plugin/highlight.js"></script>

			const controlsRoot = () => document.querySelector('.reveal .controls');
			const helperTip = document.getElementById('helper-tip');

						</mask>

					</svg>
				</span>`;

			function createSlide(index) {
				const section = document.createElement('section');
				const image = document.createElement('img');

				image.className = 'slide-image';
				image.loading = 'lazy';
				image.decoding = 'async';
				image.src = assetPath(index);
				image.alt = `Slide ${index}`;

				section.appendChild(image);
				return section;
			}

			function bumpControl(direction) {
				const control = controlsRoot()?.querySelector(`.navigate-${direction}`);
				if (!control) {
					return;
				}

				control.classList.remove('bump');
				void control.offsetWidth;
				control.classList.add('bump');
			}

			function updateHelperTip() {
				if (!helperTip) {
					return;
				}

				const indices = Reveal.getIndices();
				const isOverviewMode = Reveal.getRevealElement().classList.contains('overview');
				const isTopLevelSlide = indices.v === 0;
				const isFirstSlide = indices.h === 0 && indices.v === 0;

				if (!isOverviewMode && isFirstSlide) {
					helperTip.hidden = true;
					helperTip.innerHTML = '';
					return;
				}

				helperTip.hidden = false;
				helperTip.innerHTML = isOverviewMode
					? `Press ${escTipIcon} to exit overview mode.`
					: isTopLevelSlide
						? `Press ${downTipIcon} to see project design samples.`
						: `Press ${escTipIcon} to enter overview mode.`;
			}

			function getNavigationDirection(previousSlide, currentSlide) {
				if (!previousSlide || !currentSlide) {
					return null;
				}

				const previous = Reveal.getIndices(previousSlide);
				const current = Reveal.getIndices(currentSlide);

				if (current.h !== previous.h) {
					return current.h > previous.h ? 'right' : 'left';
				}

				if (current.v !== previous.v) {
					return current.v > previous.v ? 'down' : 'up';
				}

				return null;
			}

			for (let groupIndex = 0; groupIndex < groupStarts.length; groupIndex += 1) {
				const start = groupStarts[groupIndex];
				const end = groupIndex + 1 < groupStarts.length ? groupStarts[groupIndex + 1] - 1 : slideCount;
				const group = document.createElement('section');

				group.appendChild(createSlide(start));

				for (let index = start + 1; index <= end; index += 1) {
					group.appendChild(createSlide(index));
				}

				slidesRoot.appendChild(group);
			}

			Reveal.initialize({
				hash: true,
				controls: true,
				progress: true,
				center: false,
				transition: 'fade',
				transitionSpeed: 'fast',
				plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
			});

			Reveal.on('ready', updateHelperTip);
			Reveal.on('overviewshown', updateHelperTip);
			Reveal.on('overviewhidden', updateHelperTip);
			Reveal.on('slidechanged', (event) => {
				const direction = getNavigationDirection(event.previousSlide, event.currentSlide);
				if (direction) {
					bumpControl(direction);
				}

				updateHelperTip();
			});

			updateHelperTip();
		</script>
	</body>
</html>
